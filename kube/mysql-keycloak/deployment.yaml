---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: social-albums-mysql
  name: configmap-entry
  namespace: social-albums
data:
  entrypoint.sh: |-
    #!/bin/bash
    
    while ! mysqladmin ping -h"127.0.0.1" --silent; do
        echo "🟠 Wait for MySQL to be ready..."
        sleep 1
    done
    
    echo "🟢 MySQL is ready."
    echo "🟦 Current user: $(whoami)"
    
    export MYSQL_PWD=$(echo $MYSQL_ROOT_PASSWORD)
    
    mysql -u root -e "source /var/db/config/keycloak/keycloak-schema-config.sql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: social-albums-mysql
  name: social-albums-mysql
  namespace: social-albums
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-albums-mysql
  template:
    metadata:
      labels:
        app: social-albums-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.33
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-config-secrets
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: social-albums-mysql-pvc
            - mountPath: /var/db/config/keycloak
              name: mysql-keycloak-schema-config-vol
            - name: configmap-entry-volume
              mountPath: /bin/entrypoint.sh
              readOnly: true
              subPath: entrypoint.sh
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/entrypoint.sh"
      volumes:
        - name: social-albums-mysql-pvc
          persistentVolumeClaim:
            claimName: social-albums-mysql-pvc
        - name: mysql-keycloak-schema-config-vol
          configMap:
            name: mysql-keycloak-schema-config
            defaultMode: 420
            items:
              - key: schema.sql
                path: keycloak-schema-config.sql
        - name: configmap-entry-volume
          configMap:
            defaultMode: 0700
            name: configmap-entry