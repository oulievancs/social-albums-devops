apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: mongodb-init-config
  namespace: social-albums
configMapGenerator:
  - name: mongodb-social-schema-config
    files:
      - resources/init-mongo-db-with-collections.js
resources:
  - deployment.yaml
  - service.yaml
generatorOptions:
  disableNameSuffixHash: true # use a static name